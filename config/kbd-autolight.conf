# kbd-autolight settings.
# Copy this file to ~/.config/kbd-autolight.conf to change it only for your user.
# Apply changes with:  systemctl --user restart kbd-autolight
#
# Values calibrated on a Yoga Slim 7 ProX 14ARH7: a lit room reads ~300-400 lux,
# a covered sensor or a dark room reads 0-20 lux.

[kbd-autolight]
# Below this light level (lux) the keyboard goes to its maximum level.
#dark_lux = 20

# Below this level the keyboard uses the low level; above it, it turns off.
#dim_lux = 100

# Hysteresis around each threshold, so the backlight does not flicker (0.3 = ±30 %).
#margin = 0.3

# Seconds between sensor readings, and how many readings are averaged.
#interval = 2
#samples = 3

# Seconds the service stays paused after you change the brightness by hand
# (Fn + Space, the Plasma slider...).
#manual_pause = 600
